services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: upy
      POSTGRES_PASSWORD: upy
      POSTGRES_DB: upy
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upy -d upy"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    command: bun run src/index.ts
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://upy:upy@db:5432/upy
      API_PORT: "3000"
      CORS_ORIGIN: http://localhost:5173
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 3s
      timeout: 3s
      retries: 10

  worker:
    build: ./server
    command: bun run src/worker.ts
    environment:
      DATABASE_URL: postgres://upy:upy@db:5432/upy
      NODE_ENV: ${NODE_ENV:-development}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_DEV_LOG: ${SMTP_DEV_LOG:-true}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  pgdata:

